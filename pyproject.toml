[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "app/fixtures",  # One-off scripts
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "UP038",  # Use `X | Y` in `isinstance` call instead of `(X, Y)`
    "SIM102", # Nested `if`; prefer readability over aggressive collapsing
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # Import not at top (required by alembic)
"app/schemas.py" = ["E402"]  # Circular import avoidance

[tool.ruff.lint.isort]
known-first-party = ["app"]
