[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "app/fixtures",  # One-off scripts
    "scripts",       # One-off scripts
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # Import not at top (required by alembic)
"app/schemas.py" = ["E402"]  # Circular import avoidance

[tool.ruff.lint.isort]
known-first-party = ["app"]
