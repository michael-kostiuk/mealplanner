name: Deploy to Dokku

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: 'ssh://dokku@154.86.14.194:22/mp-be'
          ssh_private_key: ${{ secrets.DOKKU_SSH_KEY }}
          ssh_host_key: 'ssh-rsa '
